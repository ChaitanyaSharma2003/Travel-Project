    <script>
        function validate(event) {
            var name = document.getElementById('name').value;
            var password = document.getElementById('password').value;
            // var email = document.getElementById('email');

            var passwordcheck = /^(?=.\d)(?=.[a-z])(?=.[A-Z])(?=.[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
            var validpassword = passwordcheck.test(password);

            var email = document.getElementById('email').value;
            var mailformat = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
            var validemail = mailformat.test(email);



            if (name == "" && password == "" && email=="") {
                document.getElementById('name-error').innerHTML = "Please enter a your name";
                document.getElementById('name-error').style.color = "red";
                document.getElementById('password-error').innerHTML = "Please enter a some password";
                document.getElementById('password-error').style.color = "red";
                document.getElementById('email-error').innerHTML = "Please enter some email";
                document.getElementById('email-error').style.color = "red";
            }

            
            else if (  password == "" && email=="") {
               
                document.getElementById('password-error').innerHTML = "Please enter a some password";
                document.getElementById('password-error').style.color = "red";
                document.getElementById('email-error').innerHTML = "Please enter some email";
                document.getElementById('email-error').style.color = "red";
            }
            else if (name == "") {
                document.getElementById('name-error').innerHTML = "Please enter a valid name";
                document.getElementById('name-error').style.color = "red";
            }


            else if (password === "") {


                document.getElementById('password-error').innerHTML = "Please enter a some password";
                document.getElementById('password-error').style.color = "red";

            }


            // else if (!validpassword) {
            //     document.getElementById('password-error').innerHTML = "Password should contain at least <br>eight characters, including uppercase and lowercase letters,<br> numbers, and special characters.";
            //     document.getElementById('password-error').style.color = "red";

            // }

            else if (!validemail) {


                document.getElementById('email-error').innerHTML = "Please enter valid email";
                document.getElementById('email-error').style.color = "red";

            }
            else if (email === "") {

                document.getElementById('email-error').innerHTML = "Please enter some email";
                document.getElementById('email-error').style.color = "red";

            }


            else {
                var sum = 0;
            }








            if (sum == 0) {

                document.getElementById("myForm").submit();
            }

            else {

                event.preventDefault();
                return false;

            }
        }
